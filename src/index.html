<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Companion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #visual {
      width: 200px;
      height: 100px;
      background-color: lightcoral;
      color: white;
      font-size: 24px;
      display: none;
      position: fixed;
      top: 20px;
      right: -220px;
      transition: right 0.5s ease;
    }

    #visual.visible {
      right: 20px;
    }
  </style>
</head>
<body>

  <h1>Productivity Companion</h1>
  <div id="visual">⚠️ Get Back to Work!</div>

  <script src="./renderer.js"></script>

</body>
</html>
